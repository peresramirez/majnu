<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Invited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&family=Fredoka:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Cormorant Garamond', serif; }
    #app { position: fixed; inset: 0; }
    #hint { position: fixed; bottom: 8%; width: 100%; text-align: center; color: #fff; font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,.5); pointer-events: none; animation: pulse 1.8s ease-in-out infinite; transition: opacity .5s; }
    @keyframes pulse { 50% { opacity: .45; } }
    #rsvp { position: fixed; bottom: 6%; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 14px 40px; border-radius: 999px; font: 600 18px 'Cormorant Garamond', serif; letter-spacing: 2px; text-decoration: none; transition: opacity .8s, transform .8s; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    #rsvp.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    #back { position: fixed; top: 16px; left: 16px; color: #fff; opacity: .7; text-decoration: none; font-size: 16px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <a id="back" href="index.html">← Templates</a>
  <div id="hint">Tap to open</div>
  <a id="rsvp" target="_blank" rel="noopener">RSVP</a>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
