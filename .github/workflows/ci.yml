name: CI

on:
  push:
    branches: [main, dev-a, dev-b, "task/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Hourly, so a key that is revoked or runs out of quota is noticed
    # even when nobody is pushing.
    - cron: "17 * * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Public values (site URL, Supabase URL and publishable key) come from the
# committed .env.production file. Only secrets are passed in below.

jobs:
  checks:
    name: Type check, unit tests, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  connections:
    name: Service connections
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Read-only calls to each service. Supabase and Anthropic are required;
      # Stripe and Daytona are skipped until their keys are added as secrets.
      - run: npm run test:smoke
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
